<!-- Discord Widget — powered by Lanyard (https://github.com/Phineas/lanyard) -->
<!-- Join https://discord.gg/lanyard with your Discord account so it starts caching your presence. -->
<div id="discord-widget"></div>
<script>
(function () {
  var DISCORD_USER_ID = "YOUR_DISCORD_USER_ID";
  var THEME = "light"; // "light" | "dark"
  var TITLE = "Activity";

  var WS_URL = "wss://api.lanyard.rest/socket";
  var REST_BASE = "https://api.lanyard.rest/v1/users";
  var RECONNECT_BASE_MS = 1000;
  var RECONNECT_MAX_MS = 30000;

  var root = document.getElementById("discord-widget");
  if (!root) return;

  var isDark = THEME === "dark";
  var colors = isDark
    ? { text: "#fff", subtext: "rgba(255,255,255,0.4)", mono: "rgba(255,255,255,0.5)", cardBg: "#2b2d31", cardBorder: "rgba(255,255,255,0.1)" }
    : { text: "#000", subtext: "rgba(0,0,0,0.4)", mono: "rgba(0,0,0,0.5)", cardBg: "#fff", cardBorder: "rgba(0,0,0,0.1)" };

  var style = document.createElement("style");
  style.textContent =
    "#discord-widget{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;gap:12px;}" +
    "#discord-widget .dw-heading{display:flex;align-items:center;gap:8px;}" +
    "#discord-widget .dw-title{font-size:18px;font-weight:700;color:" + colors.text + ";}" +
    "#discord-widget .dw-dot{width:10px;height:10px;border-radius:9999px;background:#23a55a;animation:dw-pulse 2s infinite;}" +
    "@keyframes dw-pulse{0%,100%{opacity:1}50%{opacity:.5}}" +
    "#discord-widget .dw-card{display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid " + colors.cardBorder + ";background:" + colors.cardBg + ";padding:12px;box-shadow:0 20px 40px -24px rgba(0,0,0,0.3);text-decoration:none;}" +
    "#discord-widget .dw-card img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;}" +
    "#discord-widget .dw-kicker{font-size:12px;font-weight:500;color:" + colors.subtext + ";display:block;}" +
    "#discord-widget .dw-name{font-size:14px;font-weight:600;color:" + colors.text + ";display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}" +
    "#discord-widget .dw-detail{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:" + colors.mono + ";display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}";
  document.head.appendChild(style);

  function resolveActivityImage(activity) {
    var asset = activity.assets && activity.assets.large_image;
    if (asset) {
      if (asset.indexOf("mp:") === 0) return "https://media.discordapp.net/" + asset.slice(3);
      if (asset.indexOf("spotify:") === 0) return "https://i.scdn.co/image/" + asset.slice(8);
      if (activity.application_id) return "https://cdn.discordapp.com/app-assets/" + activity.application_id + "/" + asset + ".png";
    }
    if (activity.application_id) return "https://dcdn.dstn.to/app-icons/" + activity.application_id + ".png";
    return null;
  }

  function render(data) {
    root.innerHTML = "";
    if (!data) return;

    var playing = (data.activities || []).filter(function (a) { return a.type === 0; });
    if (!data.spotify && playing.length === 0) return;

    var heading = document.createElement("div");
    heading.className = "dw-heading";
    var title = document.createElement("span");
    title.className = "dw-title";
    title.textContent = TITLE;
    heading.appendChild(title);
    if (data.discord_status !== "offline") {
      var dot = document.createElement("span");
      dot.className = "dw-dot";
      heading.appendChild(dot);
    }
    root.appendChild(heading);

    function card(href, image, kicker, name, detail) {
      var el = document.createElement(href ? "a" : "div");
      el.className = "dw-card";
      if (href) {
        el.href = href;
        el.target = "_blank";
        el.rel = "noopener noreferrer";
      }
      if (image) {
        var img = document.createElement("img");
        img.src = image;
        img.alt = name;
        el.appendChild(img);
      }
      var info = document.createElement("div");
      info.style.minWidth = "0";
      var k = document.createElement("span");
      k.className = "dw-kicker";
      k.textContent = kicker;
      var n = document.createElement("span");
      n.className = "dw-name";
      n.textContent = name;
      var d = document.createElement("span");
      d.className = "dw-detail";
      d.textContent = detail;
      info.appendChild(k);
      info.appendChild(n);
      info.appendChild(d);
      el.appendChild(info);
      return el;
    }

    if (data.spotify) {
      root.appendChild(
        card(
          "https://open.spotify.com/track/" + data.spotify.track_id,
          data.spotify.album_art_url,
          "Listening to Spotify",
          data.spotify.song,
          data.spotify.artist
        )
      );
    }

    playing.forEach(function (activity) {
      var detail = [activity.details, activity.state].filter(Boolean).join(" · ") || "In game session";
      root.appendChild(
        card(null, resolveActivityImage(activity), "Playing", activity.name, detail)
      );
    });
  }

  // Seed via REST (fast first paint), then take over with the WebSocket for
  // live updates. Reconnects with exponential backoff if the socket drops.
  var attempts = 0;
  var socket = null;
  var heartbeatTimer = null;

  fetch(REST_BASE + "/" + encodeURIComponent(DISCORD_USER_ID))
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (payload) { if (payload && payload.data) render(payload.data); })
    .catch(function () {});

  function connect() {
    socket = new WebSocket(WS_URL);

    socket.onopen = function () {
      attempts = 0;
      socket.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_USER_ID } }));
    };

    socket.onmessage = function (event) {
      try {
        var message = JSON.parse(event.data);
        if (message.op === 1) {
          var interval = message.d && message.d.heartbeat_interval;
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          if (typeof interval === "number") {
            heartbeatTimer = setInterval(function () {
              if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ op: 3 }));
            }, interval);
          }
          return;
        }
        if (message.op !== 0 || (message.t !== "INIT_STATE" && message.t !== "PRESENCE_UPDATE")) return;
        render(message.d);
      } catch (e) {}
    };

    socket.onclose = function () {
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      var delay = Math.min(RECONNECT_BASE_MS * Math.pow(2, attempts), RECONNECT_MAX_MS);
      attempts += 1;
      setTimeout(connect, delay);
    };

    socket.onerror = function () { socket.close(); };
  }

  connect();
})();
</script>
